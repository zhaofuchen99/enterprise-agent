# 开发环境有状态组件（开发流程 4.1 / 6.1）
#
# 向量库是 Qdrant 服务端（TBC-05 结案，2026-09-17）。它实测只占约 300MB，
# 因此**不再单独放 profile**，与其余组件一同由 `make up` 拉起。
#
# 为什么必须是服务端形态而不是 SDK 的本地模式：本地模式单进程独占目录，
# 而本项目 `make run` 是 api + worker 双进程、`make ingest` 又是第三个。
# 详细设计与实测数据见「详细设计 23.1.1」。
#   make up        -> redis / agent-mysql / business-mysql / qdrant / minio
#   make rag-up    -> 兼容旧写法，等价于确保 qdrant 已启动

name: enterprise-agent-dev

services:
  redis:
    image: redis:7-alpine
    container_name: ea-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      # 宿主端口用 6381 而非 6379：本机 WSL 的原生 redis-server 已占用 6379
      # 且存有另一个在跑项目的缓存数据；6380 被 redis-stack 占用。
      # 容器内仍是 6379，只有宿主映射不同，改 REDIS_URL 即可。
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-mysql:
    image: mysql:8.0
    container_name: ea-agent-mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: agent
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent_pw
    ports:
      # 宿主端口用 3308 而非 3306：**Windows 侧另有一个独立安装的 MySQL 8**
      # （C:\Program Files\MySQL\MySQL Server 8.0\bin\mysqld.exe）占着 0.0.0.0:3306，
      # 导致 WSL2 的 wslrelay 无法为 3306 建立 127.0.0.1 转发
      # （实测：3307/6379/6380/6381/9000 都被转发，唯独没有 3306）。
      # 后果是从 Windows 用图形客户端连 localhost:3306 会连到**那个** MySQL，
      # 而不是本容器——能连上但看不到 agent_task 等表，很容易误判成迁移没跑。
      # 换到 3308 后两侧都能连（Windows 经 wslrelay，WSL 直接连）。
      # 容器内仍是 3306，只有宿主映射与 DATABASE_URL_AGENT 不同。
      - "3308:3306"
    volumes:
      - agent-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pw"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  business-mysql:
    # 演示业务库：SQL Tool 只允许用只读账号访问（详细设计 19.2）
    image: mysql:8.0
    container_name: ea-business-mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: business
      MYSQL_USER: readonly
      MYSQL_PASSWORD: readonly_pw
    ports:
      - "3307:3306"
    volumes:
      - business-mysql-data:/var/lib/mysql
      - ./scripts/init-business-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pw"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  minio:
    # 用 quay.io 而非 Docker Hub 引用：本机 daemon 配的 docker.m.daocloud.io 镜像源
    # 对 minio/minio 返回 403。quay.io 是 MinIO 官方的备用发布地址，不经过该镜像源。
    # （开发环境本可用 STORAGE_BACKEND=local 免去 MinIO，但保留它才能验证 s3 存储契约。）
    image: quay.io/minio/minio:latest
    container_name: ea-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ea-qdrant
    ports:
      - "6333:6333"   # HTTP / REST，`QDRANT_URL` 指向它
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # 镜像里没有 curl，用 bash 的内建 /dev/tcp 探端口。
      # **不用 `/readyz` 之类的 HTTP 探测**：它需要额外装工具，
      # 而"端口通不通"对本地开发已经足够——探针失败只会让 `make ps` 显示 unhealthy。
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  redis-data:
  agent-mysql-data:
  business-mysql-data:
  minio-data:
  qdrant-data:
