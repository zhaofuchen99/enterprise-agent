# 演示语料清单（详细设计 16.11.1 / 16.11.2）
#
# ## 这个文件是什么
#
# 它是**语料的规格**，不是语料本身。`scripts/gen_corpus.py` 读它，按 `type` 分派到
# 对应体裁的模板，用业务库（business MySQL）的真实取值填数，生成 PDF / DOCX / MD / TXT。
# 正文不进版本库（`data/` 已 gitignore），进版本库的是这份清单与生成器——
# 于是「语料是什么」与「语料怎么来的」都可复审，产物本身可随时重建。
#
# ## 为什么语料必须自产，不能找现成的
#
# 三条，任一条单独就足以否决「上网找企业文档」这条路：
#
# 1. **版权与获取壁垒**：公开可搜到的都是付费/注册下载的范本，且多为各方上传，许可不清。
#    本仓库公开且用于求职展示，来源不明的文本不能作为项目资产。
# 2. **与本项目业务库对不上**：语料必须与 `dim_region`（华东/华南/华北/华中/西南）、
#    `dim_product_line`（智能家居/厨房电器/个护健康/影音娱乐）、20 个具体产品、
#    2025 年事实表严格对齐。16.11.2 的「报告数字与 DB 差 1–2%」是**定量**缺陷，
#    拿一份别的公司的文档连基数都没有。
# 3. **真实文档不自带缺陷**：没有哪份公开制度会埋 Prompt Injection，
#    也没有哪份报告会故意跟数据库错开 1.5%。
#
# 但**体裁要学真的**：制度类的「第一章 总则 → 分章规则 → 附则 + 修订历史表」、
# 经营报告的「摘要 → 分项业绩 → 问题归因 → 下月计划 → 风险提示」、
# 达成率的红绿灯阈值（≥100% 绿 / 80–100% 黄 / <80% 红）都不是随便编的，
# 是按公开范本的真实结构写的。学形式不学内容，既绕开版权，又避免生成腔。
#
# ## 冻结纪律
#
# 本清单冻结后不再改动（16.11.3）。**改清单 = 换语料 = 所有阈值与评测结论失效**，
# 因此每次改动必须同时升 `version`，并重跑 Recall@8 校准与 `verify-corpus`。
# 这与 `schema_catalog.yaml` 的版本语义一致：版本号要能回答「昨天还好好的，今天为什么变了」。
version: "2026.09.17-1"

# ---------------------------------------------------------------- 应缺席的制度（16.11.2 第 10 项）
#
# 「提问涉及但语料中不存在的制度」——这条例外**没有文档可生成**，它靠的是**不生成**。
# 因此把它显式登记在这里，供两处使用：
#   - `verify-corpus`：断言全语料中不存在这些词的任何 chunk（含近义表述）；
#   - 评测集：这三条问题的期望结果是 `NO_RELEVANT_KNOWLEDGE`，不是硬凑一段答案。
#
# 未写入本清单一律视为「可以有」——所以这同时是一份**黑名单**。
absent_policies:
  - name: 跨境出海业务管理办法
    note: 演示库没有海外区域，业务上本就不该存在；问它必须拒答
  - name: 直播带货专项补贴制度
    note: 渠道只有直营/经销/电商/KA，没有直播；电商制度里用「平台内促销」覆盖
  - name: 绿色供应链碳积分规则
    note: 与库存/物流制度形似（CM-006 讲周转），是最容易被模型张冠李戴的一条

# ---------------------------------------------------------------- 手工编写的文档（16.11.2）
#
# 「文档内 Prompt Injection ≥3 份」与「无答案提问 ≥3 处」**必须人工设计**，
# 不能由生成脚本批量产出——生成模型会倾向产出「有答案」的内容，而这两类恰恰要求
# 构造者知道系统在防什么、评测问题问什么。
#
# 它们以 Markdown 源文件存放在 `configs/corpus_handwritten/`，由生成器转成目标格式。
# **正文不在生成器的模板里**——这是刻意的：模板能被批量复制，手工样本的差异性是它存在的意义。
handwritten_dir: "configs/corpus_handwritten"

# ---------------------------------------------------------------- 缺陷类型
#
# 编号与 16.11.2 的注入项一一对应，`verify-corpus` 按这个编号逐条断言。
# 断言的是「缺陷注入了且能被检出」，不是「语料里有这么一段话」——
# 两者差别很大：前者要求下游能力真的工作，后者只要求文件存在。
defect_kinds:
  VERSION_PAIR:       # 16.11.2-1  同名制度两个版本，一失效一生效（≥2 组）
  VALUE_CONFLICT:     # 16.11.2-2  报告数字与 DB 差 1–2%（≥5 处）
  TIME_CONFLICT:      # 16.11.2-3  报告统计截止日不同（≥3 处）
  SCOPE_CONFLICT:     # 16.11.2-4  区域范围定义不同（≥2 处）
  SOURCE_PAIR:        # 16.11.2-5  外部称增长、内部在下降（≥2 组）
  SCANNED:            # 16.11.2-6  图片型扫描件 PDF（≥2 份）
  CROSS_PAGE_TABLE:   # 16.11.2-7  跨页表格，表头还原（≥3 份）
  PROMPT_INJECTION:   # 16.11.2-9  文档内注入指令（≥3 份）
  # 16.11.2-8（页眉页脚 / 修订历史）不在此列：它是**全部** PDF/DOCX 的通用属性，
  # 不是少数文档的标记位。写成逐篇缺陷等于把它降级成特例，反而漏测。

