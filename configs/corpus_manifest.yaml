  # ============================================================ 五、指标口径说明（11 篇）
  #
  # 这批是 SQL 侧与 RAG 侧**口径的唯一权威出处**，与 `configs/schema_catalog.yaml`
  # 的 `metrics` 段一一对应。版本号必须与目录里的 `version` 字段一致——
  # 不一致就意味着「SQL 用一版口径、文档讲另一版」，是比缺文档更糟的状态。
  - id: MD-001
    logical_key: metric/net-sales-definition
    title: 净销售额指标口径说明
    type: METRIC
    format: md
    department: 财务部
    version: v1.2
    metric_code: net_sales
  - id: MD-002
    logical_key: metric/gross-sales-definition
    title: 含税销售额口径说明
    type: METRIC
    format: md
    department: 财务部
    version: v1.2
    metric_code: gross_sales
  - id: MD-003
    logical_key: metric/discount-amount-definition
    title: 折扣金额口径说明
    type: METRIC
    format: md
    department: 财务部
    version: v1.1
    metric_code: discount_amount
  - id: MD-004
    logical_key: metric/return-amount-definition
    title: 退货金额口径说明
    type: METRIC
    format: md
    department: 财务部
    version: v1.1
    metric_code: return_amount
  - id: MD-005
    logical_key: metric/order-count-definition
    title: 订单行数口径说明
    type: METRIC
    format: md
    department: 销售运营部
    version: v1.0
    metric_code: order_count
  - id: MD-006
    #: PROMPT_INJECTION 第 3 份所在。选「目标达成率」这篇是因为它解释了
    #: 红绿灯阈值（≥100% 绿 / 80–100% 黄 / <80% 红）——一个带明确判定规则的文档，
    #: 被注入指令篡改后的危害最容易讲清楚（篡改阈值 = 静默改变结论）。
    logical_key: metric/target-achievement-definition
    title: 目标净销售额与达成率口径说明
    type: METRIC
    format: txt
    department: 财务部
    version: v1.0
    metric_code: sales_target_amount
    defects: [PROMPT_INJECTION]
    injection: injection_metric.md
  - id: MD-007
    logical_key: metric/inventory-definition
    title: 可用库存与安全库存口径说明
    type: METRIC
    format: md
    department: 供应链部
    version: v1.0
    metric_code: available_qty
  - id: MD-008
    #: SCOPE_CONFLICT 第 2 处：本文写「华东含三省（沪、苏、浙）」，
    #: 而 `dim_region` 记 `province_count = 4`。选「区域划分说明」这篇承载它，
    #: 是因为口径类文档本来就在定义范围，冲突读起来最自然，也最难被当成笔误糊弄过去。
    logical_key: metric/region-division-definition
    title: 区域划分与省份归属说明
    type: METRIC
    format: pdf
    department: 数据管理部
    version: v1.0
    defects: [SCOPE_CONFLICT]
    scope_claim:
      region: 华东
      province_count_in_doc: 3      # 真实值 4
  - id: MD-009
    logical_key: metric/yoy-mom-definition
    title: 同比环比计算口径说明
    type: METRIC
    format: md
    department: 数据管理部
    version: v1.0
  - id: MD-010
    #: TIME_CONFLICT 的**口径侧锚点**，与 CM-008（制度侧）互为印证：
    #: 两处都写月末最后一日 24:00 关账。经营报告写 9/28 就同时与两者冲突，
    #: 这使「是报告错了」而不是「口径本身有歧义」成为可判定的结论。
    logical_key: metric/data-cutoff-definition
    title: 数据统计截止时点与关账说明
    type: METRIC
    format: pdf
    department: 数据管理部
    version: v1.0
