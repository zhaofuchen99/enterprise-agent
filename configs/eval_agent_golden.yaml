  - id: agent-loop-05
    category: loop
    question: 2026年6月华东地区的净销售额是多少？
    expect_sources: [sql_query, rag_retrieve]
    expect_plan_revision_min: 1
    # **22.10.4 的预算隔离**：14.3 明写 `expansions_left` 被 `reflect` 的演进
    # 与审查的 `retry_target=expand` **共用**，两者之和不超过配置值（2）。
    # 绕过它只有一条路——某条路自己扣了别的预算，而那正是 FR-REV-002
    # 业务规则 1 要防的"借用"。
    # ⚠️ 上限钉的是**配置值**，所以 `LOOP__MAX_EXPANSIONS` 调大时要一起改。
    expect_plan_revision_max: 2
    expect_trigger_finding_linked: true
    proves: 确定性演进与模型驱动的演进**花的是同一份预算**。实测（2026-09-28）
      这条问题跑出 `plan_revision=2`：第一步确定性补了 RAG，审查又判了一次
      "缺一整类信息"，`plan_extend` 走模型再加 3 步——两类的计数合起来
      才是"演进用了几次"，这正是 14.3 那句"避免执行阶段激进 +
      审查阶段再来一轮"要防的东西
