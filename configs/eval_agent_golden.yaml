  # ==================================================== 审查（5）
  #
  # 审查现在是**两个阶段**（14.1）：代码判事实（引用在不在、字段泄没泄），
  # 模型判尺度（引用的那些够不够）。**否决权只在前者手里**——模型一律记
  # WARNING（见 CLAUDE.md 约定 105）。这两类用例断言的是
  # 「**审查确实跑过、结论形态正确**」，不是拦截率；拦截由
  # `app/tests/agent/test_reviewer.py` 与 `test_model_review.py` 的
  # 单元用例钉住（那里能造出 BLOCKING 与各种模型判否的场景，端到端造不出来）。
  #
  # ⚠️ **断言的价值在于 `expect_review_issue_codes: []`**：Reviewer 误报的
# 症状是"分数低了点"，而分数不是通过判据——不钉住"零 issue"，
# 一条凭空多出来的 WARNING 永远不会有人发现。
# ⚠️ **但那一条只对确定性检查成立**：第二阶段的四个 code
# （`QUESTION_NOT_ANSWERED` / `INSUFFICIENT_EVIDENCE` /
# `INFERENCE_OVERREACH` / `LIMITATION_UNCLEAR`）是**模型依赖**的，
# 同一题两次跑可以不一样——所以**归因那条（05）不钉 issue 列表**，
# 只钉状态码。状态码稳得住，是因为模型那四条一律 WARNING（约定 105）。
