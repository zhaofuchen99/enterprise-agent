# Agent 端到端评测集（开发流程 6.15 第 2 项；构成见 7.4，冲刺方案 §6 定的 40 题口径）
#
# ```bash
# make eval-agent                          # 跑全部
# make eval-agent ONLY=agent-conflict-01   # 只跑一条（调 prompt 时用）
# make eval-agent-ask Q="还没固化的问题"     # 先跑一遍再固化
# ```
#
# ## 这一集测的是组件层测不到的那一层
#
# `eval-sql` 测「SQL 与金标结果集等价」、`eval-rag` 测「Recall@8」、
# `verify-corpus` 测「缺陷真的注入了产物」、校验器用例测「安全 100% 阻断」。
# **四道全绿而端到端照样可能是错的**——2026-09-20 实测到一次：
# 工具选对了、SQL 也对，而答案里的数字是错的（80 行进 8 行，差 46%），
# Reviewer 给了 100 分。问题不在任何单个组件里，在**它们串起来之后**：
# `reflect` 该不该补一路、冲突该不该报、审查该不该拦。
#
# ## 判定用 `expect_*`，判据只有一份
#
# 判据在 `scripts/agent_harness.py`，与 `make demo` **共用同一份**——
# 两份判据的漂移方式是"演示判对、评测判错"，而同一条问题在两个入口
# 给出不同结论时，没有人能说出哪个才对。这里只登记**数据**。
#
# 断言的取值来源是 `GET /api/agent/tasks/{id}`（17.2 的任务详情）：
#
# | 键 | 读的字段 | 用途 |
# |---|---|---|
# | `expect_sources` | `steps[].tool` | 工具选择与路由（**精确集合**） |
# | `expect_numbers` | 答案正文里的金额（按单位还原） | 答案层的数值门禁 |
# | `expect_conflicts` / `_count` / `_contain` | `conflicts` | 冲突检出与**不误报** |
# | `expect_limitations_contain` | `limitations` | 钉住**代码生成的**限制 |
# | `expect_rejected` / `expect_clarification` | `refused` / 步骤为空 | 拒答与澄清 |
# | `expect_review_*` | `review` | 审查确实跑过、结论形态正确 |
# | `expect_plan_*` | `plan_revision` / `plan_deltas` / `steps[].origin` | 任务循环 |
#
# `expect_sources` **缺省 = 不检查，`[]` 才是"不该调任何工具"**；
# `expect_review_issue_codes` 同理。合成一个的话，一条只断审查结论的用例
# 会被判成"工具选择不符"——而它压根没打算断言工具。
#
# ## `expect_plan_*`：该演进的钉下限，不该演进的钉精确
#
# 演进有**两个触发源**：`reflect` 的确定性判定（某一路跑了但空 → 补另一路）
# 与审查第二阶段的 `retry_target=expand`（"缺一整类信息"）。
# 前者是代码判的、每次必发生；**后者是模型判的，同一题两次跑可以不一样**。
#
# 实测（2026-09-28，问一个库里没有的期间）：第一次确定性补了 RAG，
# 审查又判了一次 expand，`plan_extend` 走模型再加 3 步——`plan_revision`
# 最终是 2。**那个 2 不是稳定值**。所以：
#
# - `expect_plan_revision_min` + `expect_extended_tools_contain`（**下限与包含**）
#   用于"反正会演进"的那几条——钉精确值等于把"模型这次怎么想的"固化成门禁；
# - `expect_plan_revision: 0` + `expect_plan_delta_count: 0`（**精确**）
#   用于"不该演进"的那几条——单源查询与澄清压根没有可补的一路，
#   模型再想加也没有由头。
#
# 与 `expect_sources`（精确）和 `expect_conflicts`（不钉条数）的取舍同一条理由：
# **能精确的地方精确，模型插得进手的地方只钉方向**（约定 90 的另一个面）。
#
# ## 金标是怎么来的
#
# **全部来自真跑**（本项目的一条纪律）：每一条都先用 `make eval-agent-ask`
# 跑过一次真链路，把实际走的工具、检出的冲突、审查结论、限制清单、
# 答案里的数抄进来，再复跑一遍。这与 `demo_questions.yaml` 同源——
# 那里踩过一次「2024年1月」（那一年恰好有数据，根本不触发演进），
# 于是"先跑一遍再固化"写成了命令。
#
# 数值全部取**基准单位**（元，不写单位），判据会按单位还原答案里的数。
# 真值来自 `make seed-business` 的确定性生成（`business_seed._rng` 是摘要
# 派生的种子），所以写死在这儿是安全的；**改了种子脚本或规模必须整份重跑**。
#
# ⚠️ **2026-09-27 二次复跑**：接上 14.1 的第二阶段（模型审查）之后，
# `agent-clarify-03` 一度从 PASS 变成 CLARIFY——模型把「语料里没有这条制度」
# 的**拒答**改判成了「你要看哪个季度？」。那是答非所问，已在
# `reviewer._combine` 里挡掉（`refused=True` 时不许改成 CLARIFY，
# 但**允许要求补证据**——那能救回同义词导致的误拒）。
#
# ## 复跑（2026-09-27，语料 `2026.09.27-1` + 冲突判据三条修完之后）
#
# **稳定用例 19/19 = 100%、观察用例 1/1、无未判定、无失败项**——与改前一致。
# 这正是约定 90 那条（"不钉冲突条数"）的用处：五条冲突用例钉的是
# "报了哪一条"与"零条"，没有一条钉条数，所以**修掉假冲突不会把用例判红**。
# ⚠️ 语料换了（`make corpus --clean`），所以这一轮走的是**全量重建**：
# `make corpus` → `make ingest FORCE=1` → `verify-corpus` 10/10 →
# `eval-rag` 20/20 → `calibrate-rerank`（0.1350 vs 0.0127，阈值 0.07 仍成立）
# → `make demo` 9/9 → `make eval-agent`。
# ⚠️ 跑之前**重启了 `make run`**：`make run` 只给 API 开 `--reload`、
# Worker 没开，而图全在 Worker 里（CLAUDE.md 约定 100）。
#
# ## 实测（2026-09-22，首次全量）
#
# **稳定用例 19/19 = 100%、观察用例 1/1、无未判定**（四类各 5/5）。
# 分母 19 而不是 20：`agent-clarify-03` 标了 `model-dependent`，不进门禁。
# 阶段基线定在 **85%**（`eval_agent._DEFAULT_BASELINE`）——单条值 5 个点，
# 贴着实测值会让门禁变成随机红；而更低则拦不住"某一类整体失效"
# （丢 5 条会掉到 14/19 = 74%）。理由见常量的注释。
#
# ⚠️ **同一份清单前后跑过三次，结果不同**，值得记下来：第一次 20/20，
# 第二次 19/20（`agent-clarify-03` 的 `refused=false`），改问法后
# 稳定用例回到 19/19。差别不在系统，在**那条用例的问法**（见它的注释）。
# 这也说明 `make eval-agent` 值得多跑几轮再固化——**单次通过不是证据**。
#
# ⚠️ **这个 100% 不等于"冲突检测是对的"**：五条冲突用例里，两条是刻意
# 用 `expect_conflict_contain` 只钉"报了那一条"（因为同时有已知的假冲突，
# 见下），两条钉的是"零条"（不误报）。**真正被验的是"该报的报了、
# 不该报的没报"这两个方向**，不是"冲突检测整体正确"。
#
# ## 扩集时实测发现的三条，**已全部修掉**（2026-09-27）
#
# ✅ **冲突检测曾经缺时间粒度**（约定 97/98）。配对规则里没有"期间"，
# 于是 2025 年 8 月的库值会被拿去和「上半年合计」「全年」「Q1」的表格行比
# ——维度都是 `{channel: 直营}`，判为可比。实测（2026-09-22）报出 4 条
# 157%–1133% 的假冲突，只有 1 条是真的。
# 现在 `report.period` 从清单一路进 payload（`ChunkMetadata.stat_period`
# → `Evidence.stat_period`），判据是 `conflict._same_period` 的**期间相等**
# ——**不是"相交"**：表格行是它那个期间的合计，而 H1/全年/H2 都包含 8 月。
# 复跑实测：同一条问题的冲突从 **4 条降到 1 条**，剩下的那条正是真的（1.58%）。
#
# ✅ **维度比较原先只判一个方向**（约定 93）。`conflict.py`
# 原先只遍历**文档侧**的键，看不见 SQL 点多出来的维度：文档「产品线表现」表是
# **全公司**口径（claim scope 只有 `{product_line: 智能家居}`），SQL 查的是
# **华东**（base scope `{region: 华东, product_line: 智能家居}`）→ 判为可比
# → 报出相对差 **499.55%** 的假冲突。现在 `_comparable` 两个方向各遍历一次，
# **空 scope 仍然放行**（`demo-cross` 那条真冲突靠它活着）。
# 回归用例见 `app/tests/agent/test_conflict.py` 里那对 `_coarser_document_row_*`。
#
# ✅ **语料生成器的明细表漏传报告自身的范围**（约定 97）。`line_rows` 原来
# 只传 `line=`，于是「华东专项分析」里那张表的分子是**全公司**、分母是**华东**，
# 占比列出现过 **187.4%**。现在三张明细表都是「报告自身的范围 + 正在枚举的
# 维度」，同一张表变成 3,813.24 万元 / 占比 **34.0%**。
#
# ⚠️ **修完之后仍然残留的一类**（不是上面三条）：文档那列写的是「销售额」
# （含税口径），DB 侧是「净销售额」——表里**只有**这一列时 `_prefer_exact`
# 无从让位，只能按别名比，于是报出 0.2%–0.4% 的**口径差异**，
# `matched_by=alias` 标着它是低可信度的。这是**有意保留**的披露
# （也是语料注入的 VALUE_CONFLICT），不是缺陷。
#
# **两条都不断言**（用 `expect_conflicts: true` + `_contain` 钉住真冲突，
# 而不是钉条数）：钉死"5 条"会让修复假冲突的改动把这条用例判红，而那是误报。
# "零条"那两条是例外——单源问题本就没有第二个来源，**精确为 0** 是稳定判据，
# 也正是"不误报"这个方向的断言。
# ⚠️ 所以上面那条修完之后，**本报告的数字不会变**：五条冲突用例钉的都是
# "报了哪一条"与"零条"，没有一条钉条数（这正是约定 90 立那条规矩的用处）。
# ## 新增：任务循环与自适应下钻（2026-09-28，5 条）
#
# 这一类在 `plan_extend` 落地之前**写不出来**（`plan_deltas` 恒空，
# 7.5 的循环断言没有载体）。现在有了，而且**演进的两条路都能在端到端里跑到**：
#
# - **确定性那条**（`reflect`：某一路跑了但空 → 补另一路）是代码判的，
#   每次必发生——所以"该演进"这一类的下限断言是硬的；
# - **模型那条**（审查第二阶段的 `retry_target=expand`）会飘，
#   所以上限与包含式断言（见文件头那段说明）。
#
# 五条的分工：
#
# | id | 期间/粒度 | 钉的是什么 |
# |---|---|---|
# | loop-01 | 2026 全年 | 该演进时演进 + **触发源可反查**（22.10.3） |
# | loop-02 | 2025 Q2 | **不该**演进时不演进（精确 0）+ 步数不涨 |
# | loop-03 | —— | **澄清路径不演进**（走 `_review_or`，见 harness） |
# | loop-04 | 2026-03 华南 | 换期间与区域仍是同一个机制 + **步数有界** |
# | loop-05 | 2026-06 华东 | **两类演进共用同一份预算**（22.10.4 的端到端形态） |
#
# 换期间/换区域/换粒度是刻意的（同 `agent-review-02` 与 `demo-sql-q2` 的理由）：
# 防的是"某一条问题碰巧总能满足断言"。
#
# ## 实测（2026-09-28，五类各 5 条）
#
# **分类通过率 5/5 × 5 类；稳定用例 24/24 = 100%、观察用例 1/1、
# 无未判定、无失败项**（分母 24 而不是 25：`agent-clarify-03` 不进门禁）。
# 跑之前重启了 `make run`（约定 100），`make demo` 同日 稳定 7/7 + 观察 2/2。
#
# ⚠️ **`agent-loop-05` 那一条证明了"钉下限"这个决定的必要**：它在
# 2026-09-28 的两次真跑里**结果不同**——探针那次 `plan_revision=2`
# （确定性一次 + 审查模型一次），评测那次只有 1 版。
# 钉精确值的话它就是一条随机红的用例；钉 1 ≤ revision ≤ 2 则两次都通过，
# 而"没演进"与"超预算"这两个真故障仍然拦得住。
version: "2026.09.28-1"

cases:
  # ==================================================== 工具选择与路由（5）
  #
  # 这一类的价值全在**精确集合**：FR-PLAN-002 业务规则 1 明写「简单指标查询
  # 不得强制调用 RAG」。一个永远两路都调的 Agent 在双源问题上表现完全正常，
  # 所以"只该调一路"的用例才是这一类的主证据。
  - id: agent-tool-01
    category: tool_selection
    question: 2025年Q3华南地区的净销售额是多少？
    expect_sources: [sql_query]
    # 真值 132,493,082.21 元（2025-07-01 ~ 2025-09-30），业务库现查
    expect_numbers: ["132493082.21"]
    expect_conflict_count: 0
    proves: 简单指标查询只走 SQL——**不因为"多调一路更保险"就调 RAG**。
      与 agent-tool-05（双源）成对：一个证明会分，一个证明会合

  - id: agent-tool-02
    category: tool_selection
    question: 2025年Q3华东地区的订单行数是多少？
    expect_sources: [sql_query]
    # 真值 12,480 行
    expect_numbers: ["12480"]
    proves: 计数类指标同样只走 SQL（`order_count` 口径，不是销售额）

  - id: agent-tool-03
    category: tool_selection
    question: 临期产品清仓折扣的适用范围和条件是什么？
    expect_sources: [rag_retrieve]
    proves: 制度问法只走 RAG——**不该去查数据库**。这是 agent-tool-01 的反面

  - id: agent-tool-04
    category: tool_selection
    question: 2025年Q3各产品线的净销售额分别是多少？
    expect_sources: [sql_query]
    # 四条产品线里取首尾两条断言即可：**断言的是"分对组了"**，
    # 不是"四条都抄对"。全抄一遍的价值不比两条多，而误报机会翻倍。
    # 真值：智能家居 123,346,973.20｜厨房电器 137,962,959.35
    #       个护健康 158,668,750.82｜影音娱乐 209,943,437.89
    expect_numbers: ["123346973.20", "209943437.89"]
    proves: 维度分组路由到 SQL 而不是 RAG；两跳 JOIN（事实 → 产品 → 产品线）
      在端到端里也走得通

  - id: agent-tool-05
    category: tool_selection
    question: 2025年Q3华东地区的净销售额是多少？经营分析报告里对区域差异是怎么解释的？
    expect_sources: [sql_query, rag_retrieve]
    # 真值 111,967,031.73 元；报告侧的数字在本集里另有断言（agent-conflict-03）
    expect_numbers: ["111967031.73"]
    proves: 数字 + 解释**两路都要**——这是双源切片存在的理由，
      也是"该分的时候分得对"的正面证据

  # ==================================================== 多源冲突（5）
  #
  # 这一集的构成刻意是 **2 真 + 2 不误报**：冲突检测的漏报看不出来
  # （答案照常给出，只是没人对过账），误报看得出来——所以两个方向都要钉。
  - id: agent-conflict-01
    category: conflict
    question: 华东区域2025年第三季度专项分析里分区域经营情况表中华南的净销售额是多少？与数据库查到的数值一致吗？
    expect_sources: [sql_query, rag_retrieve]
    expect_conflicts: true
    # 文档值 130,620,700.00（13,062.07 万元）vs 库值 132,493,082.21 → 相对 1.41%
    # **钉的是"报了哪一条"，不是"报了几条"**：钉条数会让修复假冲突的改动
    # 把这条用例判红，而那是误报（见文件头「扩集时实测发现的三条」）。
    expect_conflict_contain: ["华东区域2025年第三季度专项分析", "region=华南"]
    proves: 真冲突被检出，且**定位到具体哪一份文档、哪一行**。
      这一条与 demo-cross 同源不同行（demo 用华东行）——换一行是刻意的，
      防的是"某一行碰巧总能对上"

  - id: agent-conflict-02
    category: conflict
    question: 2025年8月直营渠道的净销售额是多少？经营月报里的数和数据库对得上吗？
    expect_sources: [sql_query, rag_retrieve]
    expect_conflicts: true
    # 真冲突：月报「销售额」列是**含税 − 折扣**口径（未扣退货），
    # 库里的 net_sales 已扣退货 → 58,625,000.00 vs 57,714,271.83，相对 1.58%。
    # ⚠️ **实测同时报出 4 条假冲突**（上半年/全年/Q1/下半年的同类表格被
    # 判为可比，相对差 157%–1133%）。
    # ✅ **已修**（2026-09-27）：期间判据生效后只剩真的那一条——
    # 复跑实测冲突从 4 条降到 1 条。
    # 这里只钉真的那一条，不钉条数。
    expect_conflict_contain: ["2025年8月经营月报", "channel=直营"]
    # 用块标量（`|-`）而不是裸标量：值以 `**` 开头时 YAML 会把它当成**别名**
    # 去解析，报的是 "expected alphabetic or numeric character" ——
    # 一个指不到这一行的错。
    proves: |-
      **口径型冲突**（同一个指标名的两种口径）也能被检出——
      它不是算错，是两份材料对「净销售额」的定义不同，尤其需要如实披露。
      别名匹配（`matched_by=alias`）会记进 `detected_difference`

  - id: agent-conflict-03
    category: conflict
    question: 2025年第三季度经营分析报告里华东地区的净销售额是多少？与数据库查到的数值一致吗？
    expect_sources: [sql_query, rag_retrieve]
    expect_conflicts: true
    # 这一条的正确答案是"**两份内部报告彼此也不一致**"：
    # 《2025年第三季度经营分析》的 11,196.70 万元与库一致（量化误差 31.73 元），
    # 而《华东区域2025年第三季度专项分析》的 11,039.58 万元与库差 1.40%
    # （那份报告的统计截止日是 09-25，比季度末早，是有意的注入）。
    expect_conflict_contain: ["华东区域2025年第三季度专项分析", "region=华东"]
