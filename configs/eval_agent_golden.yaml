  # ==================================================== 任务循环与自适应下钻（5）
  #
  # 这一类验的是**"Agent 能根据工具结果继续分析"**（冲刺方案 §8.4 第③条）
  # 的产物面：计划真的变了、变的时候留下了记录、而记录能反查到原因。
  #
  # ⚠️ **不钉冲突条数、不钉审查 issue**——那两样属别的类。这里只问
  #    "该不该下钻、下钻到哪一路、为什么"。
  - id: agent-loop-01
    category: loop
    question: 2026年全年华东地区的净销售额是多少？
    expect_sources: [sql_query, rag_retrieve]
    # 业务库只到 2025-12-31（`make seed-business` 的语料范围），所以按 2026
    # 条件查必然 0 行 → `reflect` 判 EXPAND → 补 RAG。
    # 实测（2026-09-28）：plan_revision=1、扩展出一步 rag_retrieve、refused=true。
    expect_plan_revision_min: 1
    expect_extended_tools_contain: [rag_retrieve]
    # 22.10.3 的「每个 origin=EXTENDED 的步骤都能反查到存在的 finding_id」。
    # **它同时查两个方向**：有新增步骤的 delta 必须有触发源，而那个源必须
    # 真的在推理链里。只查前者的话，一个指向不存在 id 的值照样通过。
    expect_trigger_finding_linked: true
    proves: 该下钻时下钻了，**而且下钻这一步能反查到为什么**——
      「因为第一步查空了，所以补了一路」这句话在产物上成立（推理链里那条
      finding 挂着 triggered_step_id）。只是"多跑了一步"而没有因果记录，
      与"一次性把两路都调了"在最终答案上分不出来

