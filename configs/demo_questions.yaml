# 演示问题集（开发流程 6.7 的验证命令 / 冲刺方案 §8.3 第 8 项「演示问题固化」）
#
# ## 为什么要固化
#
# 现场编的问题是**抽样不是覆盖**：model 的意图判定有随机性，
# 随手问一个恰好被判成 CLARIFICATION 的问题，演示就卡在那里，
# 而那不是系统坏了。固化一份清单让"每次演示看到的是同一批现象"，
# 也让"这次为什么和上次不一样"变成一个可查的问题。
#
# ## 每一条对应一条验收标准
#
# ## `stability` 要如实写
#
# `stable` = **实测稳定复现**，可以当门禁看；
# `model-dependent` = 结果取决于模型的意图判定或检索排序，**同一个问题
# 两次跑可能不一样**。两者混在一个通过率里，会让人以为后者也是"系统坏了"。
#
# 实测出来的不稳定性有两处，都不是缺陷而是**这类系统的固有性质**：
#
# - **问法影响路由**：「跨境出海业务管理办法怎么规定？」被判成需要 SQL，
#   于是拿到一次与问题无关的查询结果，答案从"语料里没有这条制度"
#   变成"这条办法查不到"。同一个问题换一种问法就会落到 RAG 上。
# - **检索排序有方差**：「报告表格里的数 vs 库里的数」要靠那张表被召回，
#   而召回哪几条取决于 Query Rewrite 的产物。
#
# `proves` 不是装饰：冲刺方案 §8.4 的四条标准要能被逐条指出来，
# 而**只测"两路都调了"是测不出"Agent 能自主选择"的**——
# 一个永远两路都调的 Agent 在双源问题上表现完全正常。
# 所以清单里同时有"只该调 SQL"与"只该调 RAG"两种。
#
# ## `expect` 是**断言用的**，不是给人看的说明
#
# 每条写清"应该看到什么"：走的哪几路、是否拒答、有没有冲突。
# `scripts/demo.py` 据此给 ✓/✗，而不是只把答案打出来让人自己看——
# 后者在演示时看起来一样，但它证明不了任何事。
version: "2026.09.18-1"

questions:
  - id: demo-sql
    question: "2025年Q3华东地区的净销售额是多少？"
    expect_sources: [sql_query]
    proves: "验收②：Agent 能**自主选择**工具——这条只该走 SQL。FR-PLAN-002 业务规则 1 明写「简单指标查询不得强制调用 RAG」"

  - id: demo-rag
    question: "华东区域渠道折扣政策对直营渠道的折扣上限是怎么规定的？"
    expect_sources: [rag_retrieve]
    proves: "验收②的另一面：制度问法只该走 RAG，不该去查数据库"

  - id: demo-cross
    stability: model-dependent
    question: "华东区域2025年第三季度专项分析的分区域经营情况表里，华东的净销售额是多少？与数据库里查到的季度净销售额一致吗？"
    expect_sources: [sql_query, rag_retrieve]
    expect_conflicts: true
    proves: "验收②+③+13.3：两路都调、数字对不上时**检出冲突并如实披露**。这是整个双源切片存在的理由"

  - id: demo-expand
    # **问一个库里没有的期间**（业务库只有 2024–2025 的数据）。
    # 第一版写的是「2024年1月」——而 2024 年恰恰是生成器为同比造出来的年份，
    # SQL 正常返回，于是根本不触发演进。演示问题必须**先跑一遍再固化**，
    # 否则固化的是"我以为会怎样"。
    question: "2026年1月华南地区的净销售额是多少？"
    expect_sources: [sql_query, rag_retrieve]
    expect_conflicts: false
    proves: "验收③：SQL 按条件查不到时（0 行，`SUCCEEDED` + `is_empty`），`reflect` **据此补一路 RAG** 去找解释——这是「能根据工具结果继续分析」的落点"

  - id: demo-absent
    stability: model-dependent
    # 问法里带「办法」二字，是为了让意图判定**明确落到制度上**。
    # 实测「跨境出海业务管理办法怎么规定？」会被判成需要 SQL——
    # 于是拿到一次与问题无关的查询结果，答案变成"这条办法查不到"
    # 而不是"语料里没有"。**问题措辞会影响路由**，这是意图分类的固有性质，
    # 固化演示问题时要把它当成一个变量而不是噪声。
    question: "根据《跨境出海业务管理办法》，海外渠道的报备要求是什么？"
    expect_rejected: true
    proves: "11.8 第 1 条：语料里没有的制度必须返回 NO_RELEVANT_KNOWLEDGE，**不让生成节点补写**"

  # ⚠️ 下面两条依赖**意图判定**，而模型的结构化输出偶尔会校验失败
  #（`MODEL_OUTPUT_INVALID`，需求 12.2.1 把它列为头号返工风险）。
  # `supervisor` 因此按详设 8.3「校验失败可重建一次」重试一次；
  # 仍失败时任务以 FAILED 结束，而**那是系统故障不是行为不符**——
  # 脚本会把两种情况分开报（见 `_evaluate`）。
  - id: demo-clarify
    question: "上个季度卖得怎么样？"
    expect_clarification: true
    proves: "详设 8.2 第 6 条：缺少会实质改变结果的时间与指标时进入澄清，且问题要**最小**（一次问全，不挤牙膏）"
