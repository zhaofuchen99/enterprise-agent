# Alembic 配置（开发流程 6.4 第 1 项）
#
# 这里**故意不写 sqlalchemy.url**：数据库连接串含口令，属于密钥，
# 只能来自环境变量（19.5）。真实 URL 由 migrations/env.py 从 Settings 注入。
# 若在此处填一个看似能用的 URL，会出现「.env 改了但迁移连的还是旧库」这类故障。

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# 迁移文件名带上 UTC 时间戳，使目录列表天然按时间排序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
